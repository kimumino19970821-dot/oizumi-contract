<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>契約書管理システム｜URLが変わりました</title>
<style>
  body{margin:0;background:#f4f6f9;color:#1a1a1a;min-height:100vh;display:flex;
    align-items:center;justify-content:center;padding:20px;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif}
  .box{background:#fff;border:1px solid #d9dee5;border-radius:12px;padding:32px 26px;
    max-width:480px;text-align:center}
  .logo{width:46px;height:46px;border-radius:10px;background:#1f6f5c;color:#fff;

  h1{font-size:17px;margin:0 0 6px}
  .name{font-size:13px;color:#5b6470;margin:0 0 16px}
  p{font-size:14px;color:#5b6470;line-height:1.9;margin:0 0 20px}
  a{display:inline-block;background:#1f6f5c;color:#fff;text-decoration:none;
    padding:12px 24px;border-radius:9px;font-weight:700}
  .note{font-size:12px;color:#8a5220;background:#fff7ed;border:1px solid #f0d5b8;
    border-radius:8px;padding:10px 12px;margin-top:20px;line-height:1.7}
</style>
</head>
<body>

    <div class="logo">大泉</div>
    <h1>URLが変わりました</h1>

    <p>3秒後に新しいページへ移動します。<br>切り替わらない場合は下のボタンを押してください。</p>

      業務ツール ハブ（<a href="https://osaka-daisen.github.io/daisen-tools/"
      style="background:none;color:#8a5220;padding:0;text-decoration:underline;font-weight:700">こちら</a>）
      を登録しておけば、各ツールはそこから開けます。
    </div>
  </div>
  <script>setTimeout(function(){location.replace('https://osaka-daisen.github.io/oizumi-contract/');},3000);</script>
